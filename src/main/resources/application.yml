server:
  port: 8080

spring:
  application:
    name: usage-billing-service

logging:
  level:
    root: INFO
    com.billing: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

billing:
  currency:
    enabled: true
    exchange-rates:
      EUR: 0.92
      GBP: 0.79
      INR: 83.12
  pricing:
    storage:
      billing-type: FLAT
      unit: GB_HOUR
      unit-price: 0.02
    compute:
      billing-type: TIERED
      unit: COMPUTE_HOUR
      tiers:
        - up-to: 100
          unit-price: 0.10
        - up-to: 1000
          unit-price: 0.08
        - unit-price: 0.05
    api:
      billing-type: SUBSCRIPTION
      unit: API_CALL
      monthly-fee: 50
      included-units: 1000000
      overage-unit-price: 0.001
  test:
    bulk-upload:
      allowed-environments:
        - local
        - dev